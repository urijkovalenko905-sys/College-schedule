<!DOCTYPE html>
<html lang="ru" data-theme="emerald">
<head>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme_v1') || 'emerald');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звонки · Колледж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html[data-theme="emerald"]{
    --bg: #0F1712; --surface: #172620; --surface-2: #1E322A; --border: #2A3E34;
    --text: #ECE8DC; --text-dim: #8FA096; --text-faint: #5E6E64;
    --gold: #C9A45C; --sage: #7FB69A; --rust: #C97A56;
    --sage-bg: rgba(127,182,154,0.12); --rust-bg: rgba(201,122,86,0.12); --gold-bg: rgba(201,164,92,0.12);
  }
  html[data-theme="ocean"]{
    --bg: #0B1620; --surface: #122436; --surface-2: #193049; --border: #254361;
    --text: #E8F1F7; --text-dim: #8FADC2; --text-faint: #5D7A91;
    --gold: #5FB8D9; --sage: #54C7A6; --rust: #E08768;
    --sage-bg: rgba(84,199,166,0.12); --rust-bg: rgba(224,135,104,0.12); --gold-bg: rgba(95,184,217,0.12);
  }
  html[data-theme="plum"]{
    --bg: #150E1B; --surface: #221730; --surface-2: #2E1F40; --border: #3F2C56;
    --text: #F0E8F5; --text-dim: #AA96BE; --text-faint: #6E5D82;
    --gold: #D79BE0; --sage: #7FD9AE; --rust: #E07596;
    --sage-bg: rgba(127,217,174,0.12); --rust-bg: rgba(224,117,150,0.12); --gold-bg: rgba(215,155,224,0.12);
  }
  html[data-theme="ember"]{
    --bg: #1A100B; --surface: #2A1810; --surface-2: #3A2116; --border: #4D2E1F;
    --text: #F5EAE0; --text-dim: #C2A088; --text-faint: #8A6B57;
    --gold: #E8A23D; --sage: #7BBF8A; --rust: #E2603F;
    --sage-bg: rgba(123,191,138,0.12); --rust-bg: rgba(226,96,63,0.12); --gold-bg: rgba(232,162,61,0.12);
  }
  html[data-theme="slate"]{
    --bg: #0D1117; --surface: #161B22; --surface-2: #1F2733; --border: #2C3644;
    --text: #E6EBF0; --text-dim: #8B98A8; --text-faint: #5A6472;
    --gold: #6FC2D9; --sage: #63C089; --rust: #D96B6B;
    --sage-bg: rgba(99,192,137,0.12); --rust-bg: rgba(217,107,107,0.12); --gold-bg: rgba(111,194,217,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(circle at 20% -10%, rgba(255,255,255,0.06), transparent 45%),
      var(--bg);
    transition: background-color 0.25s ease;
  }
  .mono{ font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* header */
  header{
    padding: 28px 22px 18px;
    position: relative;
  }
  .icon-btn{
    position:absolute;
    top:26px; right:22px;
    width:34px; height:34px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .date-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.02em;
    margin-bottom:10px;
  }
  .date-row .week-tag{
    color:var(--gold);
    font-weight:600;
  }
  .clock{
    font-size:52px;
    font-weight:500;
    letter-spacing:0.01em;
    line-height:1;
    color:var(--text);
  }
  .clock .secs{ color:var(--text-faint); font-size:28px; margin-left:2px;}

  /* status card */
  .status-card{
    margin:6px 22px 0;
    border-radius:18px;
    padding:20px;
    border:1px solid var(--border);
    background:var(--surface);
    position:relative;
    overflow:hidden;
  }
  .status-card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
  }
  .status-card.state-lesson{ background:var(--sage-bg); border-color:rgba(127,182,154,0.35);}
  .status-card.state-lesson::before{ background:var(--sage);}
  .status-card.state-break{ background:var(--rust-bg); border-color:rgba(201,122,86,0.35);}
  .status-card.state-break::before{ background:var(--rust);}
  .status-card.state-idle{ background:var(--gold-bg); border-color:rgba(201,164,92,0.3);}
  .status-card.state-idle::before{ background:var(--gold);}

  .status-label{
    font-size:12px;
    text-transform:none;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .status-title{
    font-size:21px;
    font-weight:700;
    margin-bottom:2px;
  }
  .status-sub{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .countdown-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .countdown{
    font-size:34px;
    font-weight:600;
  }
  .countdown-caption{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .progress-track{
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.08);
    margin-top:14px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:2px;
    background:var(--sage);
    width:0%;
    transition:width 1s linear;
  }
  .state-break .progress-fill{ background:var(--rust);}
  .state-idle .progress-fill{ background:var(--gold);}

  /* today list */
  .section-title{
    padding:24px 22px 10px;
    font-size:13px;
    color:var(--text-dim);
    font-weight:600;
  }
  .today-list{
    padding:0 22px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .today-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .today-item:last-child{ border-bottom:none;}
  .pair-num{
    width:22px; height:22px;
    border-radius:6px;
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-weight:600;
  }
  .today-item.active .pair-num{ background:var(--sage); color:var(--bg);}
  .today-item.done .pair-num{ opacity:0.4; }
  .today-item.done .item-subject{ color:var(--text-faint); text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .item-body{ flex:1; min-width:0; }
  .item-subject{ font-size:14.5px; font-weight:600; }
  .item-teacher{ font-size:12px; color:var(--text-dim); margin-top:1px; }
  .item-time{ font-size:12px; color:var(--text-dim); flex-shrink:0; text-align:right; }

  .empty-note{
    padding: 10px 4px 4px;
    color:var(--text-dim);
    font-size:13.5px;
    line-height:1.5;
  }

  /* schedule tab */
  .day-tabs{
    display:flex;
    gap:6px;
    padding:16px 22px 4px;
    overflow-x:auto;
  }
  .day-tab{
    flex-shrink:0;
    padding:7px 13px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    background:var(--surface);
    border:1px solid var(--border);
    cursor:pointer;
  }
  .day-tab.selected{
    color:var(--bg);
    background:var(--gold);
    border-color:var(--gold);
  }
  .day-tab.is-today::after{
    content:"";
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--sage);
    margin-left:6px;
    vertical-align:middle;
  }
  .day-tab.selected.is-today::after{ background:var(--bg); }

  .lesson-card{
    margin:10px 22px 0;
    padding:14px 16px;
    border-radius:14px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex;
    gap:14px;
    align-items:center;
  }
  .lesson-card .pair-num{ width:26px; height:26px; border-radius:8px; font-size:13px;}
  .lesson-time{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:2px;
  }
  .lesson-note{
    font-size:11px;
    color:var(--gold);
    margin-top:3px;
  }
  .no-classes{
    margin:14px 22px 0;
    padding:22px 16px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    border:1px dashed var(--border);
    border-radius:14px;
  }

  /* bells tab */
  .shift-block{
    margin:14px 22px 0;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .shift-header{
    padding:10px 16px;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface-2);
  }
  .bell-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 16px;
    background:var(--surface);
    border-top:1px solid var(--border);
  }
  .bell-row .pair-num{ background:var(--surface-2); }
  .bell-time{ font-size:14.5px; font-weight:600; }
  .bell-break{
    padding:6px 16px 6px 50px;
    background:var(--surface);
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--rust);
  }

  /* bottom nav */
  nav{
    margin-top:auto;
    position:sticky;
    bottom:0;
    display:flex;
    background:rgba(15,23,18,0.92);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--border);
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    padding:6px 0;
    cursor:pointer;
  }
  .nav-btn.selected{ color:var(--gold); }
  .nav-btn svg{ width:20px; height:20px; }

  .tab-panel{ display:none; flex:1; padding-bottom:14px; }
  .tab-panel.visible{ display:flex; flex-direction:column; }

  ::-webkit-scrollbar{ display:none; }

  /* settings modal */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    align-items:flex-end;
    justify-content:center;
    z-index:60;
  }
  .modal-overlay.visible{ display:flex; }
  .modal-sheet{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:20px 20px 0 0;
    padding:20px 22px calc(20px + env(safe-area-inset-bottom));
  }
  .modal-title{ font-size:17px; font-weight:700; margin-bottom:18px; }
  .modal-section{ margin-bottom:18px; }
  .modal-label{ font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:8px; }
  .segmented{
    display:flex;
    background:var(--surface-2);
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .segmented button{
    flex:1;
    padding:9px 4px;
    border:none;
    background:none;
    color:var(--text-dim);
    font-family:inherit;
    font-weight:600;
    font-size:12.5px;
    border-radius:8px;
    cursor:pointer;
  }
  .segmented button.active{ background:var(--gold); color:var(--bg); }
  .theme-swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .swatch{
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .swatch.active{ border-color:var(--text); }
  .swatch-emerald{ background:linear-gradient(135deg,#C9A45C,#7FB69A); }
  .swatch-ocean{ background:linear-gradient(135deg,#5FB8D9,#54C7A6); }
  .swatch-plum{ background:linear-gradient(135deg,#D79BE0,#7FD9AE); }
  .swatch-ember{ background:linear-gradient(135deg,#E8A23D,#E2603F); }
  .swatch-slate{ background:linear-gradient(135deg,#6FC2D9,#63C089); }
  .modal-close{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--surface-2);
    color:var(--text);
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  /* grades tab */
  .add-grade-btn{
    width:100%;
    padding:12px;
    text-align:center;
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--text-dim);
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .grade-form{
    margin:12px 22px 0;
    padding:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .grade-form input, .grade-form textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    outline:none;
  }
  .grade-form textarea{ resize:vertical; min-height:56px; }
  .grade-form-row{ display:flex; gap:9px; }
  .grade-form-row input{ flex:1; min-width:0; }
  .grade-form-actions{ display:flex; gap:8px; margin-top:2px; }
  .grade-form-actions button{
    flex:1;
    padding:10px;
    border-radius:10px;
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    border:none;
  }
  .grade-save{ background:var(--gold); color:var(--bg); }
  .grade-cancel{ background:none; border:1px solid var(--border) !important; color:var(--text-dim); font-weight:600 !important; }
  .grade-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 15px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .grade-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .grade-subject{ font-size:14.5px; font-weight:700; }
  .grade-badge-wrap{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .badge{ padding:3px 10px; border-radius:8px; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .badge-sage{ background:var(--sage-bg); color:var(--sage); }
  .badge-gold{ background:var(--gold-bg); color:var(--gold); }
  .badge-rust{ background:var(--rust-bg); color:var(--rust); }
  .grade-del{
    width:22px; height:22px;
    border-radius:6px;
    border:none;
    background:var(--surface-2);
    color:var(--text-faint);
    font-size:14px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }
  .grade-meta{ font-size:12px; color:var(--text-dim); }
  .grade-note{ font-size:13px; color:var(--text-dim); line-height:1.4; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="tab-panel visible" id="panel-home">
    <header>
      <button class="icon-btn" id="settings-btn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.7-1l-.4-2.4H10l-.4 2.4a7.7 7.7 0 0 0-1.7 1l-2.3-.9-2 3.4L5.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.8 1.7 1l.4 2.4h4l.4-2.4c.6-.2 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
      </button>
      <div class="date-row">
        <span id="date-label">—</span>
        <span class="week-tag" id="week-label">—</span>
      </div>
      <div class="clock mono" id="clock">00:00<span class="secs">:00</span></div>
    </header>

    <div class="status-card" id="status-card">
      <div class="status-label" id="status-label">Загрузка…</div>
      <div class="status-title" id="status-title">—</div>
      <div class="status-sub" id="status-sub">—</div>
      <div class="countdown-row">
        <div>
          <div class="countdown-caption" id="countdown-caption">осталось</div>
          <div class="countdown mono" id="countdown">—</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="section-title">Пары сегодня</div>
    <div class="today-list" id="today-list"></div>
  </div>

  <!-- SCHEDULE -->
  <div class="tab-panel" id="panel-schedule">
    <header style="padding-bottom:0;">
      <div class="date-row"><span>Расписание занятий</span></div>
      <div style="font-size:19px; font-weight:700;">гр. 26.191 Б</div>
    </header>
    <div class="day-tabs" id="day-tabs"></div>
    <div id="schedule-list"></div>
  </div>

  <!-- BELLS -->
  <div class="tab-panel" id="panel-bells">
    <header style="padding-bottom:0;">
      <div class="date-row"><span>Расписание звонков</span></div>
      <div style="font-size:19px; font-weight:700;">с 01.09.2022</div>
    </header>
    <div id="bells-list"></div>
  </div>

  <!-- GRADES -->
  <div class="tab-panel" id="panel-grades">
    <header style="padding-bottom:0;">
      <div class="date-row"><span>Зачётка</span></div>
      <div style="font-size:19px; font-weight:700;" id="grades-summary">—</div>
    </header>
    <div style="padding:14px 22px 0;">
      <button class="add-grade-btn" id="add-grade-btn">+ Добавить запись</button>
    </div>
    <div class="grade-form" id="grade-form" style="display:none;">
      <input type="text" id="gf-subject" list="subjects-datalist" placeholder="Предмет">
      <datalist id="subjects-datalist"></datalist>
      <div class="grade-form-row">
        <input type="text" id="gf-teacher" placeholder="Преподаватель">
        <input type="text" id="gf-grade" placeholder="Оценка (5, зачёт…)">
      </div>
      <input type="date" id="gf-date">
      <textarea id="gf-note" placeholder="Заметка (необязательно)"></textarea>
      <div class="grade-form-actions">
        <button class="grade-save" id="grade-save-btn">Сохранить</button>
        <button class="grade-cancel" id="grade-cancel-btn">Отмена</button>
      </div>
    </div>
    <div id="grades-list" style="padding:14px 22px 0; display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal-sheet">
      <div class="modal-title">Настройки</div>
      <div class="modal-section">
        <div class="modal-label">Неделя</div>
        <div class="segmented" id="week-segmented">
          <button data-val="auto">Авто</button>
          <button data-val="odd">Нечётная</button>
          <button data-val="even">Чётная</button>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-label">Тема оформления</div>
        <div class="theme-swatches" id="theme-swatches">
          <button class="swatch swatch-emerald" data-theme="emerald" aria-label="Изумруд"></button>
          <button class="swatch swatch-ocean" data-theme="ocean" aria-label="Океан"></button>
          <button class="swatch swatch-plum" data-theme="plum" aria-label="Слива"></button>
          <button class="swatch swatch-ember" data-theme="ember" aria-label="Закат"></button>
          <button class="swatch swatch-slate" data-theme="slate" aria-label="Графит"></button>
        </div>
      </div>
      <button class="modal-close" id="settings-close">Готово</button>
    </div>
  </div>

  <nav>
    <button class="nav-btn selected" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      Главная
    </button>
    <button class="nav-btn" data-tab="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8 3v4M16 3v4"/></svg>
      Расписание
    </button>
    <button class="nav-btn" data-tab="bells">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a5 5 0 0 0-5 5v3.5L5 16h14l-2-3.5V9a5 5 0 0 0-5-5z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
      Звонки
    </button>
    <button class="nav-btn" data-tab="grades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5 2 9l10 4 10-4-10-4Z"/><path d="M6 11v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5"/></svg>
      Оценки
    </button>
  </nav>
</div>

<script>
/* ---------- data ---------- */

// bell times, in minutes from 00:00
function t(h,m){ return h*60+m; }

const BELLS_WEEKDAY = {
  1: [ {n:1, start:t(8,0),  end:t(9,30)},
       {n:2, start:t(9,40), end:t(11,10)},
       {n:3, start:t(11,30),end:t(13,0)} ],
  2: [ {n:1, start:t(13,10),end:t(14,40)},
       {n:2, start:t(15,0), end:t(16,30)},
       {n:3, start:t(16,40),end:t(18,10)} ]
};
const BELLS_SATURDAY = {
  1: [ {n:1, start:t(8,0),  end:t(9,20)},
       {n:2, start:t(9,30), end:t(10,50)},
       {n:3, start:t(11,0), end:t(12,20)} ],
  2: [ {n:1, start:t(12,30),end:t(13,50)},
       {n:2, start:t(14,0), end:t(15,20)},
       {n:3, start:t(15,30),end:t(16,50)} ]
};

// weekly class schedule. getDay(): 0=Sun..6=Sat
// each pair references bell number `n` and the weekday/saturday bell table
const RAW_SCHEDULE = {
  1: { label:'Понедельник', shift:1, table:BELLS_WEEKDAY, pairs:[
        {n:1, subject:'Математика', code:'ОД.03', teacher:'Букреева Т.А.'},
        {n:2, subject:'Химия', code:'ОД.07', teacher:'Зайцева М.Ф.'},
        {n:3, subject:'История', code:'ОД.09', teacher:'Зинченко А.А.'} ] },
  2: { label:'Вторник', shift:1, table:BELLS_WEEKDAY, pairs:[
        {n:1, subject:'География', code:'ОД.11', teacher:'Гарина Н.В.'},
        {n:2, subject:'Русский язык', code:'ОД.01', teacher:'Беженова И.Н. (вакансия)'},
        {n:3, subject:'Информатика', code:'ОД.05', teacher:'Жоха В.Н.'} ] },
  3: { label:'Среда', shift:2, table:BELLS_WEEKDAY, pairs:[
        {n:1, subject:'Физика', code:'ОД.06', teacher:'Нам Р.В.'},
        {n:2, subject:'Биология', code:'ОД.08', teacher:'Острожная Е.Е.'},
        {n:3, subject:'Обществознание', code:'ОД.10', teacher:'Гарина Н.В.'} ] },
  4: { label:'Четверг', shift:2, table:BELLS_WEEKDAY, pairs:[
        {n:1, alt:true, even:{subject:'Иностранный язык', code:'ОД.04', teacher:'Фоменко Е.А.'}, odd:{subject:'Математика', code:'ОД.03', teacher:'Букреева Т.А.'}},
        {n:2, subject:'Биология', code:'ОД.08', teacher:'Острожная Е.Е.'},
        {n:3, subject:'Основы безопасности и защиты Родины', code:'ОД.13', teacher:'Соколов А.В.'} ] },
  5: { label:'Пятница', shift:1, table:BELLS_WEEKDAY, pairs:[
        {n:1, alt:true, even:{subject:'История', code:'ОД.09', teacher:'Зинченко А.А.'}, odd:{subject:'Информатика', code:'ОД.05', teacher:'Жоха В.Н.'}},
        {n:2, subject:'Физическая культура', code:'ОД.12', teacher:'Вакансия'},
        {n:3, subject:'Литература', code:'ОД.02', teacher:'Беженова И.Н. (вакансия)'} ] },
  6: { label:'Суббота', shift:1, table:BELLS_SATURDAY, pairs:[
        {n:1, subject:'Введение в специальность', code:'ДУП.01', teacher:'Желтобовская А.А.'},
        {n:2, subject:'Математика', code:'ОД.03', teacher:'Букреева Т.А.'},
        {n:3, subject:'Индивидуальный проект', code:'', teacher:'Гарина Н.В. (вакансия)'} ] },
  0: { label:'Воскресенье', shift:null, table:null, pairs:[] }
};

const DAY_ORDER = [1,2,3,4,5,6,0];

/* ---------- helpers ---------- */

function moscowNow(){
  return new Date(new Date().toLocaleString('en-US', { timeZone:'Europe/Moscow' }));
}

// week 1 (нечётная) starts Monday 31.08.2026
const TERM_MONDAY = new Date('2026-08-31T00:00:00');

function getWeekOverride(){ return localStorage.getItem('weekOverride_v1') || 'auto'; }
function setWeekOverride(v){ localStorage.setItem('weekOverride_v1', v); }

function isEvenWeek(d){
  const override = getWeekOverride();
  if(override==='even') return true;
  if(override==='odd') return false;
  const dayIdx = (d.getDay()+6)%7; // Mon=0..Sun=6
  const thisMonday = new Date(d);
  thisMonday.setHours(0,0,0,0);
  thisMonday.setDate(d.getDate()-dayIdx);
  const diffDays = Math.round((thisMonday - TERM_MONDAY)/86400000);
  const weekNum = Math.floor(diffDays/7)+1;
  return weekNum%2===0;
}

function resolvePairs(dayNum, even){
  const day = RAW_SCHEDULE[dayNum];
  if(!day.pairs.length) return [];
  return day.pairs.map(p=>{
    const bell = day.table[day.shift].find(b=>b.n===p.n);
    if(p.alt){
      const chosen = even ? p.even : p.odd;
      return { n:p.n, subject:chosen.subject, code:chosen.code, teacher:chosen.teacher, start:bell.start, end:bell.end, alt:true };
    }
    return { n:p.n, subject:p.subject, code:p.code, teacher:p.teacher, start:bell.start, end:bell.end, alt:false };
  }).sort((a,b)=>a.start-b.start);
}

function fmtHM(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmtCountdown(totalSec){
  totalSec = Math.max(0,totalSec);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

const WEEKDAY_NAMES = ['ВОСКРЕСЕНЬЕ','ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА','СУББОТА'];
const MONTH_NAMES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ---------- render: home ---------- */

function renderHome(){
  const now = moscowNow();
  const dayNum = now.getDay();
  const nowMin = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const even = isEvenWeek(now);

  document.getElementById('date-label').textContent =
    WEEKDAY_NAMES[dayNum] + ', ' + now.getDate() + ' ' + MONTH_NAMES[now.getMonth()];
  document.getElementById('week-label').textContent =
    (even ? 'ЧЁТНАЯ' : 'НЕЧЁТНАЯ') + ' НЕДЕЛЯ' + (getWeekOverride()!=='auto' ? ' · ВРУЧНУЮ' : '');

  document.getElementById('clock').innerHTML =
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+
    '<span class="secs">:'+String(now.getSeconds()).padStart(2,'0')+'</span>';

  const pairs = resolvePairs(dayNum, even);
  const card = document.getElementById('status-card');
  const label = document.getElementById('status-label');
  const title = document.getElementById('status-title');
  const sub = document.getElementById('status-sub');
  const cd = document.getElementById('countdown');
  const cdCap = document.getElementById('countdown-caption');
  const fill = document.getElementById('progress-fill');

  card.className = 'status-card';

  if(!pairs.length){
    card.classList.add('state-idle');
    label.textContent = 'Сегодня занятий нет';
    title.textContent = WEEKDAY_NAMES[dayNum].charAt(0)+WEEKDAY_NAMES[dayNum].slice(1).toLowerCase();
    sub.textContent = 'Хорошего отдыха';
    cdCap.textContent = '';
    cd.textContent = '—';
    fill.style.width = '0%';
  } else if(nowMin < pairs[0].start){
    card.classList.add('state-idle');
    label.textContent = 'До начала занятий';
    title.textContent = pairs[0].subject;
    sub.textContent = pairs[0].teacher + ' · пара ' + pairs[0].n;
    cdCap.textContent = 'до звонка';
    cd.textContent = fmtCountdown(Math.round((pairs[0].start-nowMin)*60));
    fill.style.width = '0%';
  } else if(nowMin >= pairs[pairs.length-1].end){
    card.classList.add('state-idle');
    label.textContent = 'Уроки закончились';
    title.textContent = 'Можно идти домой';
    sub.textContent = 'Последняя пара — ' + pairs[pairs.length-1].subject;
    cdCap.textContent = '';
    cd.textContent = '—';
    fill.style.width = '100%';
  } else {
    let current = pairs.find(p=>nowMin>=p.start && nowMin<p.end);
    if(current){
      card.classList.add('state-lesson');
      label.textContent = 'Идёт пара ' + current.n;
      title.textContent = current.subject;
      sub.textContent = current.teacher + ' · ' + fmtHM(current.start) + '–' + fmtHM(current.end);
      cdCap.textContent = 'до конца пары';
      cd.textContent = fmtCountdown(Math.round((current.end-nowMin)*60));
      const frac = (nowMin-current.start)/(current.end-current.start);
      fill.style.width = Math.min(100,Math.max(0,frac*100))+'%';
    } else {
      const next = pairs.find(p=>p.start>nowMin);
      const prevEnd = pairs.slice().reverse().find(p=>p.end<=nowMin).end;
      card.classList.add('state-break');
      label.textContent = 'Перемена';
      title.textContent = 'Следующая: ' + next.subject;
      sub.textContent = next.teacher + ' · пара ' + next.n;
      cdCap.textContent = 'до звонка';
      cd.textContent = fmtCountdown(Math.round((next.start-nowMin)*60));
      const frac = (nowMin-prevEnd)/(next.start-prevEnd);
      fill.style.width = Math.min(100,Math.max(0,frac*100))+'%';
    }
  }

  const list = document.getElementById('today-list');
  if(!pairs.length){
    list.innerHTML = '<div class="empty-note">В расписании группы 26.191 Б на '+WEEKDAY_NAMES[dayNum].toLowerCase()+' пары не стоят.</div>';
  } else {
    list.innerHTML = pairs.map(p=>{
      let state = 'upcoming';
      if(nowMin>=p.end) state='done';
      else if(nowMin>=p.start) state='active';
      return '<div class="today-item '+state+'">'+
        '<div class="pair-num">'+p.n+'</div>'+
        '<div class="item-body">'+
          '<div class="item-subject">'+p.subject+'</div>'+
          '<div class="item-teacher">'+p.teacher+'</div>'+
        '</div>'+
        '<div class="item-time">'+fmtHM(p.start)+'–'+fmtHM(p.end)+'</div>'+
      '</div>';
    }).join('');
  }
}

/* ---------- render: schedule tab ---------- */

let selectedDay = null;

function renderDayTabs(){
  const now = moscowNow();
  const todayNum = now.getDay();
  if(selectedDay===null) selectedDay = todayNum;
  const wrap = document.getElementById('day-tabs');
  wrap.innerHTML = DAY_ORDER.map(d=>{
    const cls = 'day-tab'+(d===selectedDay?' selected':'')+(d===todayNum?' is-today':'');
    return '<button class="'+cls+'" data-day="'+d+'">'+RAW_SCHEDULE[d].label.slice(0,3)+'</button>';
  }).join('');
  wrap.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ selectedDay = parseInt(btn.dataset.day,10); renderSchedule(); });
  });
}

function renderSchedule(){
  renderDayTabs();
  const now = moscowNow();
  const even = isEvenWeek(now);
  const pairs = resolvePairs(selectedDay, even);
  const wrap = document.getElementById('schedule-list');
  if(!pairs.length){
    wrap.innerHTML = '<div class="no-classes">Пар нет</div>';
    return;
  }
  wrap.innerHTML = pairs.map(p=>{
    return '<div class="lesson-card">'+
      '<div class="pair-num">'+p.n+'</div>'+
      '<div class="item-body">'+
        '<div class="item-subject">'+(p.code?p.code+' ':'')+p.subject+'</div>'+
        '<div class="item-teacher">'+p.teacher+'</div>'+
        (p.alt?'<div class="lesson-note">чередуется по неделям</div>':'')+
      '</div>'+
      '<div class="lesson-time">'+fmtHM(p.start)+'<br>'+fmtHM(p.end)+'</div>'+
    '</div>';
  }).join('') + '<div style="height:14px"></div>';
}

/* ---------- render: bells tab ---------- */

function renderBells(){
  function block(title, table){
    let html = '<div class="shift-block"><div class="shift-header">'+title+'</div>';
    [1,2].forEach((shiftNum,si)=>{
      const borderCss = si===0 ? 'border-top:none;' : '';
      html += '<div class="bell-row" style="background:var(--surface-2); font-size:11.5px; color:var(--text-dim); font-weight:700; padding:8px 16px; '+borderCss+'">'+(shiftNum===1?'1 смена':'2 смена')+'</div>';
      const bells = table[shiftNum];
      bells.forEach((b,i)=>{
        html += '<div class="bell-row"><div class="pair-num">'+b.n+'</div><div class="bell-time">'+fmtHM(b.start)+' – '+fmtHM(b.end)+'</div></div>';
        if(i<bells.length-1){
          const nextStart = bells[i+1].start;
          html += '<div class="bell-break">перемена '+(nextStart-b.end)+' мин</div>';
        }
      });
    });
    html += '</div>';
    return html;
  }
  document.getElementById('bells-list').innerHTML =
    block('Понедельник – пятница · по 3 пары в смену', BELLS_WEEKDAY) +
    block('Суббота · по 3 пары в смену', BELLS_SATURDAY) +
    '<div style="height:18px"></div>';
}

/* ---------- theme ---------- */

function getTheme(){ return localStorage.getItem('theme_v1') || 'emerald'; }
function setTheme(v){
  localStorage.setItem('theme_v1', v);
  document.documentElement.setAttribute('data-theme', v);
}

/* ---------- settings modal ---------- */

function syncSettingsUI(){
  const override = getWeekOverride();
  document.querySelectorAll('#week-segmented button').forEach(b=>{
    b.classList.toggle('active', b.dataset.val===override);
  });
  const theme = getTheme();
  document.querySelectorAll('#theme-swatches .swatch').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===theme);
  });
}

document.getElementById('settings-btn').addEventListener('click', ()=>{
  syncSettingsUI();
  document.getElementById('settings-overlay').classList.add('visible');
});
document.getElementById('settings-close').addEventListener('click', ()=>{
  document.getElementById('settings-overlay').classList.remove('visible');
});
document.getElementById('settings-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='settings-overlay') document.getElementById('settings-overlay').classList.remove('visible');
});
document.querySelectorAll('#week-segmented button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    setWeekOverride(btn.dataset.val);
    syncSettingsUI();
    renderHome();
    renderSchedule();
  });
});
document.querySelectorAll('#theme-swatches .swatch').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    setTheme(btn.dataset.theme);
    syncSettingsUI();
  });
});

/* ---------- gradebook ---------- */

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getGrades(){
  try{ return JSON.parse(localStorage.getItem('gradebook_v1') || '[]'); }
  catch(e){ return []; }
}
function saveGrades(arr){ localStorage.setItem('gradebook_v1', JSON.stringify(arr)); }

function getSubjectTeacherMap(){
  const map = {};
  Object.values(RAW_SCHEDULE).forEach(day=>{
    (day.pairs||[]).forEach(p=>{
      if(p.alt){
        if(!map[p.even.subject]) map[p.even.subject] = p.even.teacher;
        if(!map[p.odd.subject]) map[p.odd.subject] = p.odd.teacher;
      } else if(!map[p.subject]){
        map[p.subject] = p.teacher;
      }
    });
  });
  return map;
}

function gradeColor(g){
  const s = String(g).trim().toLowerCase();
  const num = parseFloat(s.replace(',', '.'));
  if(!isNaN(num)){
    if(num>=4) return 'sage';
    if(num>=3) return 'gold';
    return 'rust';
  }
  if(s.indexOf('незач')===0 || s.indexOf('неуд')===0) return 'rust';
  if(s.indexOf('зач')===0 || s.indexOf('пройд')===0) return 'sage';
  return 'gold';
}

function fmtDateShort(dateStr){
  const parts = (dateStr||'').split('-');
  if(parts.length!==3) return '';
  const d = new Date(parts[0]+'-'+parts[1]+'-'+parts[2]+'T00:00:00');
  return d.getDate()+' '+MONTH_NAMES[d.getMonth()];
}

function todayIso(){
  const now = moscowNow();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
}

function renderGrades(){
  const grades = getGrades();
  const nums = grades.map(g=>parseFloat(String(g.grade).replace(',','.'))).filter(n=>!isNaN(n));
  const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2) : null;
  document.getElementById('grades-summary').textContent =
    !grades.length ? 'Записей пока нет' :
    (avg ? 'Средний балл: '+avg+' · ' : '') + grades.length+' '+(grades.length===1?'запись':'записей');

  const map = getSubjectTeacherMap();
  document.getElementById('subjects-datalist').innerHTML =
    Object.keys(map).map(s=>'<option value="'+escapeHtml(s)+'">').join('');

  const list = document.getElementById('grades-list');
  if(!grades.length){
    list.innerHTML = '<div class="empty-note">Пока нет ни одной записи. Добавляйте оценки и заметки, чтобы не забыть, кто и что вам поставил.</div>';
    return;
  }
  const sorted = grades.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.id-a.id);
  list.innerHTML = sorted.map(g=>{
    const color = gradeColor(g.grade);
    return '<div class="grade-card">'+
      '<div class="grade-card-top">'+
        '<div class="grade-subject">'+escapeHtml(g.subject||'Без названия')+'</div>'+
        '<div class="grade-badge-wrap">'+
          '<div class="badge badge-'+color+'">'+escapeHtml(g.grade)+'</div>'+
          '<button class="grade-del" data-id="'+g.id+'">×</button>'+
        '</div>'+
      '</div>'+
      '<div class="grade-meta">'+escapeHtml(g.teacher||'')+(g.date?' · '+fmtDateShort(g.date):'')+'</div>'+
      (g.note ? '<div class="grade-note">'+escapeHtml(g.note)+'</div>' : '')+
    '</div>';
  }).join('');
  list.querySelectorAll('.grade-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseFloat(btn.dataset.id);
      saveGrades(getGrades().filter(g=>g.id!==id));
      renderGrades();
    });
  });
}

function resetGradeForm(){
  document.getElementById('gf-subject').value = '';
  document.getElementById('gf-teacher').value = '';
  document.getElementById('gf-grade').value = '';
  document.getElementById('gf-note').value = '';
  document.getElementById('gf-date').value = todayIso();
}

document.getElementById('add-grade-btn').addEventListener('click', ()=>{
  const form = document.getElementById('grade-form');
  const opening = form.style.display==='none';
  form.style.display = opening ? 'flex' : 'none';
  if(opening) resetGradeForm();
});
document.getElementById('gf-subject').addEventListener('input', (e)=>{
  const map = getSubjectTeacherMap();
  const teacherField = document.getElementById('gf-teacher');
  if(map[e.target.value] && !teacherField.value){
    teacherField.value = map[e.target.value];
  }
});
document.getElementById('grade-cancel-btn').addEventListener('click', ()=>{
  document.getElementById('grade-form').style.display = 'none';
});
document.getElementById('grade-save-btn').addEventListener('click', ()=>{
  const subject = document.getElementById('gf-subject').value.trim();
  const grade = document.getElementById('gf-grade').value.trim();
  if(!subject || !grade){ return; }
  const entry = {
    id: Date.now(),
    subject: subject,
    teacher: document.getElementById('gf-teacher').value.trim(),
    grade: grade,
    note: document.getElementById('gf-note').value.trim(),
    date: document.getElementById('gf-date').value || todayIso()
  };
  const arr = getGrades();
  arr.push(entry);
  saveGrades(arr);
  document.getElementById('grade-form').style.display = 'none';
  renderGrades();
});

/* ---------- tabs ---------- */

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('visible'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('visible');
  });
});

/* ---------- init ---------- */

renderHome();
renderSchedule();
renderBells();
renderGrades();
setInterval(renderHome, 1000);
</script>
</body>
</html>
